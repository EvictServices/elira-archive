<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status</title>
  <meta name="description" content="Live status and statistics for the evict Discord bot.">
  <meta name="theme-color" content="#0d1021">
  <link rel="icon" href="/img/evict.webp" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page">

    <div class="st-wrap">
      <div class="container">

        <div class="st-header" data-reveal>
          <div class="st-header-left">
            <h1 class="st-title">Status</h1>
          </div>
          <div class="st-header-stats">
            <div class="st-hstat">
              <span class="st-hstat-num" id="stat-guilds">—</span>
              <span class="st-hstat-key">Servers</span>
            </div>
            <div class="st-hstat">
              <span class="st-hstat-num" id="stat-users">—</span>
              <span class="st-hstat-key">Users</span>
            </div>
            <div class="st-hstat">
              <span class="st-hstat-num" id="stat-shards">—</span>
              <span class="st-hstat-key">Shards</span>
            </div>
          </div>
        </div>

        <div style="margin: 2rem 0; width: 100%; overflow: hidden;">
          <svg width="100%" height="60" viewBox="0 0 1200 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,30 Q150,10 300,30 T600,30 T900,30 T1200,30" 
                  stroke="rgba(71,141,166,0.3)" 
                  stroke-width="1" 
                  fill="none"
                  stroke-linecap="round"/>
            <path d="M0,30 Q150,50 300,30 T600,30 T900,30 T1200,30" 
                  stroke="rgba(102,178,204,0.2)" 
                  stroke-width="1" 
                  fill="none"
                  stroke-linecap="round"/>
          </svg>
        </div>

        <div class="st-charts" data-reveal>
          <div class="st-chart">
            <div class="st-chart-row">
              <span class="st-chart-name">Latency</span>
              <span class="st-chart-cur mono" id="chart-latency-val">—</span>
            </div>
            <div class="chart-area" id="chart-latency"></div>
          </div>
          <div class="st-chart">
            <div class="st-chart-row">
              <span class="st-chart-name">CPU</span>
              <span class="st-chart-cur mono" id="chart-cpu-val">—</span>
            </div>
            <div class="chart-area" id="chart-cpu"></div>
          </div>
          <div class="st-chart">
            <div class="st-chart-row">
              <span class="st-chart-name">Memory</span>
              <span class="st-chart-cur mono" id="chart-mem-val">—</span>
            </div>
            <div class="chart-area" id="chart-memory"></div>
          </div>
          <div class="st-chart">
            <div class="st-chart-row">
              <span class="st-chart-name">Network</span>
              <span class="st-chart-cur mono" id="chart-net-val">—</span>
            </div>
            <div class="chart-area" id="chart-network"></div>
          </div>
        </div>

        <div class="st-panels" data-reveal>
          <div class="st-panel">
            <div class="st-panel-title">Shards</div>
            <div id="shard-grid" class="shard-grid"></div>
          </div>
          <div class="st-panel">
            <div class="st-panel-title">Top Commands</div>
            <div id="top-commands-grid" class="top-commands-grid"></div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script src="/js/gradient.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/status.js"></script>
</body>
</html>
