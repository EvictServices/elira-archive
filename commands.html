<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commands</title>
  <meta name="description" content="Browse all evict bot commands — moderation, information, settings, and more.">
  <meta name="theme-color" content="#1c2137">
  <link rel="icon" href="/img/evict.webp" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page">

    <div class="commands-page-header">
      <div class="container">
        <div class="section-header" data-reveal>
          <h2 class="section-title">Commands</h2>
          <p class="section-desc">Browse all available commands. Click on a command for detailed usage.</p>
        </div>

        <div style="margin: 2rem 0; width: 100%; overflow: hidden;">
          <svg width="100%" height="60" viewBox="0 0 1200 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0,30 Q150,10 300,30 T600,30 T900,30 T1200,30" 
                  stroke="rgba(71,141,166,0.3)" 
                  stroke-width="1" 
                  fill="none"
                  stroke-linecap="round"/>
            <path d="M0,30 Q150,50 300,30 T600,30 T900,30 T1200,30" 
                  stroke="rgba(102,178,204,0.2)" 
                  stroke-width="1" 
                  fill="none"
                  stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>

    <section class="section" style="padding-top: 0;">
      <div class="container">
        <div class="commands-toolbar" data-reveal>
          <div class="commands-search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><evict.webp cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="commands-search" placeholder="Search commands..." autocomplete="off" spellcheck="false">
          </div>
          <div id="commands-filters" class="commands-filters"></div>
        </div>
        <div id="commands-grid" class="commands-grid" data-reveal></div>
      </div>
    </section>

  </div>

  <script src="/js/gradient.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/commands.js"></script>
</body>
</html>
